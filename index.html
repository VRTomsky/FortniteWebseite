<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shopradar</title>
  <meta name="description" content="Fortnite Item-Shop live: tägliche Rotation, Comebacks und wann ein Item zuletzt da war, Leaks, V-Bucks-Rechner und 3D-Ansicht.">
  <meta name="theme-color" content="#0a0e19">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fortnite-api.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt springen</a>

  <header class="topbar">
    <a class="brand" href="#/shop" aria-label="Shopradar – zum Item-Shop">
      <svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true"><path fill="#18213a" d="M10 4h50l-6 56H4z"/><path fill="none" stroke="#ffe23f" stroke-width="4" d="M16 46a22 22 0 0 1 22-22"/><path fill="none" stroke="#ffe23f" stroke-width="4" opacity=".55" d="M24 46a14 14 0 0 1 14-14"/><path fill="#ffe23f" d="M16 46l22-22v22z" opacity=".25"/><circle cx="38" cy="46" r="5" fill="#ffe23f"/></svg>
      <span class="brand__word">Shop<b>radar</b></span>
    </a>

    <nav class="nav" aria-label="Hauptnavigation">
      <a href="#/shop" data-nav="shop">Shop</a>
      <a href="#/archiv" data-nav="archiv">Archiv</a>
      <a href="#/leaks" data-nav="leaks">Leaks</a>
      <a href="#/season" data-nav="season">Season</a>
      <a href="#/vbucks" data-nav="vbucks">V-Bucks</a>
      <a href="#/spind" data-nav="spind">Spind<span class="dot" data-wish-dot hidden></span></a>
      <a href="#/stats" data-nav="stats">Stats</a>
      <a href="#/setup" data-nav="setup" data-setup-link hidden>Setup</a>
    </nav>

    <div class="topbar__meta">
      <div class="reset-pill" title="Der Item-Shop wechselt täglich um 00:00 UTC">
        <span class="label">Neuer Shop in</span>
        <span class="clock" data-until-reset data-fmt="clock">--:--:--</span>
      </div>
      <button class="balance-chip" type="button" data-balance-btn aria-haspopup="dialog" title="Dein V-Bucks-Guthaben">
        <img src="https://fortnite-api.com/images/vbuck.png" alt="" width="18" height="18">
        <span data-balance>—</span>
        <span class="sr-only">V-Bucks-Guthaben ändern</span>
      </button>
    </div>
  </header>

  <div id="banner-slot"></div>

  <main id="main" tabindex="-1">
    <noscript><p class="notice notice--warn">Diese Seite braucht JavaScript, um den Shop live zu laden.</p></noscript>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <p>Shopradar ist ein Fan-Projekt und nicht mit Epic Games verbunden. Fortnite und alle Item-Bilder sind Marken bzw. Eigentum von Epic Games. Daten: <a href="https://fortnite-api.com" rel="noopener" target="_blank">fortnite-api.com</a>.</p>
      <div class="footer__links">
        <a href="#/setup">Einstellungen</a>
        <a href="#/season">Saison-Infos</a>
      </div>
    </div>
  </footer>

  <div id="viewer-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
